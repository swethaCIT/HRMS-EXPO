version: '3.9'

# Runs only the infrastructure services (Postgres + Redis) for local development.
# Use this when running the backend with `npm run start:dev` directly.

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms_user
      POSTGRES_PASSWORD: hrms_password
      POSTGRES_DB: hrms_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hrms_redis_dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
