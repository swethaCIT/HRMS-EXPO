version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms_user
      POSTGRES_PASSWORD: hrms_password
      POSTGRES_DB: hrms_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms_user -d hrms_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hrms_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Repo root: npm workspaces hoists the only lockfile here, so building
      # from ./apps/backend left `npm ci` with nothing to install from.
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: hrms_backend
    restart: unless-stopped
    env_file:
      # .env is gitignored, so a fresh clone has no such file and compose used
      # to abort with "env file not found". `required: false` lets the stack
      # come up on the `environment:` defaults below instead.
      - path: ./apps/backend/.env
        required: false
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

volumes:
  postgres_data:
  redis_data:
